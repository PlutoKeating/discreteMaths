<script type="text/x-markdown" id="md-overview">
## 0.1 整个 Logic 只有一个底层事实：真值只有 T 和 F

- 一个==命题==就是一个"非真即假"的句子。所有联结词 $\neg,\ \land,\ \lor,\ \to,\ \leftrightarrow$ 都只是==对 T/F 做运算的函数==，就像 $+\ -\ \times\ \div$ 对数字做运算一样。
- 所以任何逻辑问题，追到底都是在问：**"在每一种 T/F 组合下，这个式子算出来是什么？"**
- 真值表 = 把所有组合一个个算一遍。考试禁止用真值表，是逼你用"代数定律"（等价律）来做，但==定律全部是从真值表里验证出来的==，背不住时可以在草稿纸上用真值表偷偷验证。

## 0.2 三个核心概念，全都用"真值"定义

| 概念 | 一句话定义 | 怎么证明它成立 | 怎么证明它不成立 |
|---|---|---|---|
| ==等价== $P \equiv Q$ | 任何情况下 $P$ 和 $Q$ 真值都相同（$P \leftrightarrow Q$ 是永真式） | 用等价律把一边变形成另一边 | 找**一组赋值**让两边真值不同（反例） |
| ==推理有效== | 前提全真的时候，结论**必定**真 | 用推理规则一步步从前提推到结论 | 造**一个场景**：前提全真、结论假 |
| ==命题为真== | 在给定的 domain 下算出来是 T | $\forall$：对所有元素逐一说明；$\exists$：举一个例子 | $\forall$：举一个反例；$\exists$：对所有元素说明都不行 |

> 第 1 题 b)、第 2 题、第 4 题 全部是这三行的直接应用。

## 0.3 谓词逻辑只是在命题逻辑上加了"对象"和"范围"

- 命题逻辑：$p$ = "Bob 通过了课程"，$p$ 是一个整体，拆不开。
- 谓词逻辑：$P(x)$ = "$x$ 通过了课程"，把"主语 $x$"抠出来变成变量。$P(\text{Bob})$ 才是一个命题。
- 量词：$\forall x\,P(x)$ = "域里==每一个== $x$ 代进去都为真"；$\exists x\,P(x)$ = "域里==至少一个== $x$ 代进去为真"。
- ==有限域的本质==（slides 1.3 p17 / p19）：

$$\forall x\,P(x) \;\equiv\; P(x_1)\land P(x_2)\land\cdots\land P(x_n)\qquad\text{（}\forall\text{ 就是一长串 }\land\text{）}$$
$$\exists x\,P(x) \;\equiv\; P(x_1)\lor P(x_2)\lor\cdots\lor P(x_n)\qquad\text{（}\exists\text{ 就是一长串 }\lor\text{）}$$

记住这一条，量词的所有定律（De Morgan、分配律、为什么 $\forall$ 配 $\to$、$\exists$ 配 $\land$）都能自己推出来。

## 0.4 证明 = 把"推理有效"写成人能读的文字

- 形式证明（第 1 题那种）：每一步写规则名。
- 非形式证明（第 5、6 题那种）：用自然语言，但每一步仍然是"由前提 + 定义 + 已知事实 ⇒ 下一句"。
- 所有证明方法（直接、逆否、反证、分情况、存在性、唯一性）都只是==把目标命题换一个等价的形式==再去证。

```mermaid
flowchart LR
  A["真值 T / F"] --> B["联结词<br/>¬ ∧ ∨ → ↔"]
  B --> C["等价律<br/>(真值永远相同)"]
  B --> D["推理规则<br/>(前提真 ⇒ 结论真)"]
  A --> E["谓词 P(x)<br/>+ 量词 ∀ ∃"]
  E --> C
  E --> D
  C --> F["证明方法<br/>直接 / 逆否 / 反证 / 分情况 / 存在 / 唯一"]
  D --> F
```

<script type="text/x-markdown" id="md-formulas">
## 1.1 六个联结词真值表（slides 1.1 p39）

| $p$ | $q$ | $\neg p$ | $p\land q$ | $p\lor q$ | $p\oplus q$ | $p\to q$ | $p\leftrightarrow q$ |
|---|---|---|---|---|---|---|---|
| T | T | F | T | T | F | T | T |
| T | F | F | F | T | T | ==F== | F |
| F | T | T | F | T | T | T | F |
| F | F | T | F | F | F | T | T |

**记忆要点（第一性原理）：**

- $\land$ 只有全 T 才 T；$\lor$ 只有全 F 才 F。
- ==$p\to q$ 只有 "p 真 q 假" 这一行是 F==。前提假时整句自动为真（"空话也算对"）。这是整章最重要的一行，第 1 题 ii) iii) 的陷阱、第 2 题 c) 的化简、第 5 题选逆否法，全部来源于此。
- $p\leftrightarrow q$：两边真值相同就 T。
- $\oplus$：恰好一个 T。

## 1.2 运算优先级（slides 1.1 p41；1.3 p23）

$$1.\ \neg \qquad 2.\ \land \qquad 3.\ \lor,\ \oplus \qquad 4.\ \to \qquad 5.\ \leftrightarrow$$

量词 $\forall x$、$\exists x$ 的优先级比所有命题联结词都高：$\forall x\,P(x)\land Q(x)$ 读作 $(\forall x\,P(x))\land Q(x)$。考试写答案==宁可多加括号==，不要依赖优先级。

## 1.3 条件语句 $p\to q$ 的所有英文说法（slides 1.1 p31）—— 翻译题的核心

以下全部等于 $p \to q$：

- If p, then q ／ If p, q ／ p implies q
- ==q if p==（if 后面的是前提！）
- ==p only if q==（only if 后面的是结论！）
- q whenever p ／ q follows from p
- ==p is sufficient for q==（充分条件 = 前件）
- ==q is necessary for p==（必要条件 = 后件）

| 关系 | 公式 | 和原式等价吗 |
|---|---|---|
| 原式 | $p\to q$ | — |
| 逆命题 Converse | $q\to p$ | ✗ |
| 否命题 Inverse | $\neg p\to\neg q$ | ✗ |
| ==逆否命题 Contrapositive== | $\neg q\to\neg p$ | ==✓ 等价== |

逆命题 ≡ 否命题（它们互为逆否）。$p\leftrightarrow q$ 读作 "p if and only if q"、"p iff q"、"p is necessary and sufficient for q"。

## 1.4 等价律总表（slides 1.2 p82 原表 + p83 / p86 蕴含、双条件）

### A. 基本十律（原表）

| 名称 | $\land$ 版本 | $\lor$ 版本 |
|---|---|---|
| Identity 同一律 | $p\land \mathbf{T}\equiv p$ | $p\lor \mathbf{F}\equiv p$ |
| Domination 支配律 | $p\land \mathbf{F}\equiv \mathbf{F}$ | $p\lor \mathbf{T}\equiv \mathbf{T}$ |
| Idempotent 幂等律 | $p\land p\equiv p$ | $p\lor p\equiv p$ |
| Double Negation 双重否定 | $\neg(\neg p)\equiv p$ | |
| Negation 否定律 | $p\land\neg p\equiv \mathbf{F}$ | $p\lor\neg p\equiv \mathbf{T}$ |
| Commutative 交换律 | $p\land q\equiv q\land p$ | $p\lor q\equiv q\lor p$ |
| Associative 结合律 | $(p\land q)\land r\equiv p\land(q\land r)$ | $(p\lor q)\lor r\equiv p\lor(q\lor r)$ |
| ==Distributive 分配律== | $p\land(q\lor r)\equiv(p\land q)\lor(p\land r)$ | $p\lor(q\land r)\equiv(p\lor q)\land(p\lor r)$ |
| Absorption 吸收律 | $p\land(p\lor q)\equiv p$ | $p\lor(p\land q)\equiv p$ |
| ==De Morgan== | $\neg(p\land q)\equiv\neg p\lor\neg q$ | $\neg(p\lor q)\equiv\neg p\land\neg q$ |

### B. 蕴含相关（slides p83，老师说"只需背第一条"，其余可推）

$$\begin{aligned}
\bigstar\quad p\to q &\equiv \neg p\lor q &&\text{（蕴含消去——所有题目第一步都是它）}\\
p\to q &\equiv \neg q\to\neg p &&\text{（逆否）}\\
p\lor q &\equiv \neg p\to q\\
p\land q &\equiv \neg(p\to\neg q)\\
\neg(p\to q) &\equiv p\land\neg q &&\text{（蕴含的否定：前件真且后件假）}\\
(p\to q)\land(p\to r) &\equiv p\to(q\land r)\\
(p\to r)\land(q\to r) &\equiv (p\lor q)\to r &&\text{（分情况证明的依据）}\\
(p\to q)\lor(p\to r) &\equiv p\to(q\lor r)\\
(p\to r)\lor(q\to r) &\equiv (p\land q)\to r\\
p\to(q\to r) &\equiv (p\land q)\to r &&\text{（Exportation，第 2 题 b）}
\end{aligned}$$

### C. 双条件相关（slides p86，只需背第一条）

$$\begin{aligned}
\bigstar\quad p\leftrightarrow q &\equiv (p\to q)\land(q\to p)\\
p\leftrightarrow q &\equiv (p\land q)\lor(\neg p\land\neg q)\\
p\leftrightarrow q &\equiv \neg p\leftrightarrow\neg q\\
\neg(p\leftrightarrow q) &\equiv p\leftrightarrow\neg q
\end{aligned}$$

### D. 用等价律做题的固定套路

1. ==先消 ↔==（换成两个 $\to$ 的 $\land$），==再消 →==（$p\to q\equiv\neg p\lor q$）。
2. ==用 De Morgan 把 ¬ 推到最里面==，只留在单个变量前。
3. ==用分配律 / 吸收律整理==，目标是把两边化成同样的"∧ 里套 ∨"或"∨ 里套 ∧"。
4. 每一步右边**写规则名**（De Morgan's Laws / Distributive Laws …），tutorial 答案就是这个格式。

```mermaid
flowchart LR
  A["原式"] --> B["消 ↔<br/>p↔q ≡ (p→q)∧(q→p)"]
  B --> C["消 →<br/>p→q ≡ ¬p∨q"]
  C --> D["De Morgan<br/>¬ 推到变量前"]
  D --> E["分配 / 吸收 / 否定律<br/>整理成同一形式"]
  E --> F{"两边一样?"}
  F -- 是 --> G["等价 ✓<br/>每步写规则名"]
  F -- 否 --> H["找反例<br/>给具体赋值并算出两边"]
```

## 1.5 谓词与量词（slides 1.3 / 1.4）

### A. 四个要素 + 真假判定（p13, p22）

一个量化语句必须说清：==量词、变量、谓词、域（domain）==。

| 语句 | 何时为真 | 何时为假 |
|---|---|---|
| $\forall x\,P(x)$ | 每个 $x$ 都使 $P(x)$ 真 | 存在一个 $x$ 使 $P(x)$ 假（==反例 counterexample==） |
| $\exists x\,P(x)$ | 存在一个 $x$ 使 $P(x)$ 真（==举例==） | 每个 $x$ 都使 $P(x)$ 假 |

### B. 为什么 ∀ 配 →、∃ 配 ∧（p43、p45）—— 翻译题最大陷阱

- "Every student in this class is lazy"，域 = 所有人：$\forall x\,(S(x)\to L(x))$ ✓
  - 若写成 $\forall x\,(S(x)\land L(x))$：意思变成"所有人都是本班学生而且都懒" ✗
- "Some student in this class is lazy"：$\exists x\,(S(x)\land L(x))$ ✓
  - 若写成 $\exists x\,(S(x)\to L(x))$：只要域里有一个不是本班学生的人，前件假、整句就真了，毫无意义 ✗

> **第一性原理**：∀ 是一串 ∧，我们只想"管"满足 $S$ 的那些元素，对不满足 $S$ 的元素要"放行"，而 → 在前件假时恰好自动为 T（放行）。∃ 是一串 ∨，我们需要"真的找到一个既 $S$ 又 $L$ 的"，所以必须 ∧。

### C. 量词的 De Morgan（p37–38）

$$\neg\forall x\,P(x)\equiv\exists x\,\neg P(x)\qquad\text{"不是所有都…" = "存在一个不…"}$$
$$\neg\exists x\,P(x)\equiv\forall x\,\neg P(x)\qquad\text{"不存在一个…" = "所有都不…"}$$

嵌套时逐层往里推，每穿过一个量词就翻转一次：$\neg\forall x\exists y\,P\equiv\exists x\forall y\,\neg P$。

### D. 量词分配律（p35）—— 哪些是等价、哪些只是单向

$$\begin{aligned}
\forall x\,(P(x)\land Q(x)) &\equiv \forall x\,P(x)\land\forall x\,Q(x) &&\checkmark\ \text{等价}\\
\exists x\,(P(x)\lor Q(x)) &\equiv \exists x\,P(x)\lor\exists x\,Q(x) &&\checkmark\ \text{等价}\\
\forall x\,P(x)\lor\forall x\,Q(x) &\Rightarrow \forall x\,(P(x)\lor Q(x)) &&\text{只能单向}\\
\exists x\,(P(x)\land Q(x)) &\Rightarrow \exists x\,P(x)\land\exists x\,Q(x) &&\text{只能单向}
\end{aligned}$$

反例：$P$ = 偶数，$Q$ = 奇数，域 = 整数：$\forall x(P\lor Q)$ 真，但 $\forall xP\lor\forall xQ$ 假。

### E. 量词与"不含 x 的命题 A"的互动（p36，域非空）

$$\begin{aligned}
\forall x\,(A\land P(x)) &\equiv A\land\forall x\,P(x) & \exists x\,(A\land P(x)) &\equiv A\land\exists x\,P(x)\\
\forall x\,(A\lor P(x)) &\equiv A\lor\forall x\,P(x) & \exists x\,(A\lor P(x)) &\equiv A\lor\exists x\,P(x)\\
\forall x\,(A\to P(x)) &\equiv A\to\forall x\,P(x) & \exists x\,(A\to P(x)) &\equiv A\to\exists x\,P(x)\\
\forall x\,(P(x)\to A) &\equiv \exists x\,P(x)\to A\ \bigstar & \exists x\,(P(x)\to A) &\equiv \forall x\,P(x)\to A\ \bigstar\\
\forall x\,A &\equiv A & \exists x\,A &\equiv A\quad\text{（第 2 题 c 用到）}
\end{aligned}$$

带 ★ 的两条会"翻转"，原因：$P(x)\to A\equiv\neg P(x)\lor A$，$\forall x$ 穿过 $\neg$ 时变 $\exists$。

### F. 嵌套量词顺序（p55–57）

- 同类型可以换顺序：$\forall x\forall y\equiv\forall y\forall x$，$\exists x\exists y\equiv\exists y\exists x$。
- ==不同类型不能换==：$\forall x\exists y\,P(x,y)$（每个 $x$ 都能找到自己的 $y$，$y$ 可随 $x$ 变）**≠** $\exists y\forall x\,P(x,y)$（有一个万能的 $y$ 对所有 $x$ 都行）。
- 单向成立：$\exists y\forall x\,P(x,y)\Rightarrow\forall x\exists y\,P(x,y)$（有万能的当然每人都有）。
- ==博弈读法（最直观）==：从左往右读，∀ 是"对手随便选"，∃ 是"我来选"。我后选就可以看着对手的牌出，我先选就要一手牌应付对手所有出法。

### G. "恰好一个 / 恰好两个"的写法（p66–79）

$$\begin{aligned}
\text{恰好一个：}&\ \exists x\,\big(P(x)\land\forall z\,(P(z)\to z=x)\big)\ \text{或}\ \exists x\,\big(P(x)\land\forall z\,(z\neq x\to\neg P(z))\big)\\
\text{恰好两个：}&\ \exists x\exists y\,\big(P(x)\land P(y)\land x\neq y\land\forall z\,(P(z)\to(z=x\lor z=y))\big)\\
\text{至少一个：}&\ \exists x\,P(x)\qquad \text{至多一个：}\ \forall x\forall y\,(P(x)\land P(y)\to x=y)
\end{aligned}$$

### H. 受限域缩写（p50）

$$\forall x>10\,(x^2>100)\equiv\forall x\,(x>10\to x^2>100)\qquad\forall\text{ 展开用 }\to$$
$$\exists x>0\,(x^2=2)\equiv\exists x\,(x>0\land x^2=2)\qquad\exists\text{ 展开用 }\land$$

## 1.6 推理规则（slides 1.5 p13、p25、p34）

### A. 命题推理规则八条

| 名称 | 形式 | 口诀 |
|---|---|---|
| ==Modus Ponens== 肯定前件 | $p,\ p\to q\ \therefore q$ | 有因必有果 |
| ==Modus Tollens== 否定后件 | $\neg q,\ p\to q\ \therefore\neg p$ | 无果必无因 |
| Hypothetical Syllogism 假言三段论 | $p\to q,\ q\to r\ \therefore p\to r$ | 链式传递 |
| Disjunctive Syllogism 析取三段论 | $p\lor q,\ \neg p\ \therefore q$ | 二选一排除 |
| Addition 附加 | $p\ \therefore p\lor q$ | 真的东西或上任何都还真 |
| Simplification 化简 | $p\land q\ \therefore p$ | 且里面拆一个出来 |
| Conjunction 合取 | $p,\ q\ \therefore p\land q$ | 两个真合起来 |
| Resolution 消解 | $p\lor q,\ \neg p\lor r\ \therefore q\lor r$ | 对消 $p$ |

### B. 量词推理规则四条

| 名称 | 形式 | 使用条件 |
|---|---|---|
| ==Universal Instantiation (UI)== | $\forall x\,P(x)\ \therefore P(c)$ | $c$ 是域中任意**指定**元素（如 Bob） |
| Universal Generalization (UG) | $P(c)$，$c$ 任意 $\therefore\forall x\,P(x)$ | $c$ 必须是"任取的"，不能是某个特定的 |
| ==Existential Instantiation (EI)== | $\exists x\,P(x)\ \therefore P(c)$，某个 $c$ | $c$ 是新名字，只知道它存在 |
| ==Existential Generalization (EG)== | $P(c)\ \therefore\exists x\,P(x)$ | 有一个例子就能说存在 |

**组合规则（p34）**：Universal Modus Ponens：$\forall x(P(x)\to Q(x)),\ P(a)\ \therefore Q(a)$；Universal Modus Tollens：$\forall x(P(x)\to Q(x)),\ \neg Q(a)\ \therefore\neg P(a)$。

### C. 两个经典谬误（p24）—— 第 1 题 ii) iii) 考的就是它

| 谬误 | 形式 | 为什么错 |
|---|---|---|
| ==Fallacy of affirming the conclusion== 肯定后件 | $p\to q,\ q\ \therefore p$ ✗ | $q$ 真时 $p$ 可真可假（真值表第 3 行） |
| ==Fallacy of denying the hypothesis== 否定前件 | $p\to q,\ \neg p\ \therefore\neg q$ ✗ | $p$ 假时 $q$ 可真可假（真值表第 3、4 行） |

记法：$p\to q$ 只告诉你"p 真那一半世界"发生了什么，对"p 假的世界"==什么都没说==。

### D. 一个推理有效的判定（p6）

论证 $p_1,p_2,\dots,p_n\ \therefore q$ 有效 $\iff (p_1\land p_2\land\cdots\land p_n)\to q$ 是永真式。要说明==无效==：给出一组真值（或一个具体场景 / 模型），让所有前提为 T 而 $q$ 为 F。

## 1.7 证明方法总表（slides 1.6 p40–81）

| 要证的形式 | 方法 | 做法 | 什么时候用 |
|---|---|---|---|
| $p\to q$ | ==直接证明 Direct== | 假设 $p$，推出 $q$ | 从 $p$ 能自然算出 $q$ 时 |
| $p\to q$ | ==逆否证明 Contraposition== | 假设 $\neg q$，推出 $\neg p$（因为 $p\to q\equiv\neg q\to\neg p$） | 从 $p$ 出发要开根号 / 除法算不动，但从 $\neg q$ 出发能代公式时（**第 5 题**） |
| 任意 $p$（含 $p\to q$） | ==反证法 Contradiction== | 假设 $\neg p$，推出矛盾 $(r\land\neg r)$ 或 F | 结论是"不存在 / 无理数 / 不可能"类 |
| $p\leftrightarrow q$ | 双向证明 | 分别证 $p\to q$ 和 $q\to p$ | 题目含 iff |
| $p_1\leftrightarrow\cdots\leftrightarrow p_n$ | 环形链 | $p_1\to p_2\to\cdots\to p_n\to p_1$ | 多个命题等价 |
| $(p_1\lor p_2\lor\cdots)\to q$ | 分情况 Cases | 每种情况各证一次 | 含绝对值、奇偶、正负、min/max |
| 有限个对象 | 穷举 Exhaustive | 全部代入检查 | $n\le 4$ 之类 |
| $\exists x\,P(x)$ | 存在性 Existence | 给出一个具体例子 | 题目说 "there exists" |
| $\exists!x\,P(x)$ | ==唯一性 Uniqueness== | ①存在：给例子 ②唯一：设另有 $y$ 满足，推出 $y=x$ | 题目说 "unique / exactly one"（**第 6 题**） |

**反证法的第一性原理**：要证 $p$，证 $\neg p\to\mathbf{F}$。因为 $\neg p\to\mathbf{F}\equiv\neg(\neg p)\lor\mathbf{F}\equiv p$。对 $p\to q$ 用反证：假设 $\neg(p\to q)\equiv p\land\neg q$，然后推矛盾。

**常用定义（证明题必须写出来才算推理严密）：**

- $n$ 是偶数 $\iff\exists k\in\Z,\ n=2k$；$n$ 是奇数 $\iff\exists k\in\Z,\ n=2k+1$
- $r$ 是有理数 $\iff\exists p,q\in\Z,\ q\neq 0,\ r=p/q$（通常再加"$p$、$q$ 互质 / 最简"）
- $a$ 是完全平方数 $\iff\exists b\in\Z,\ a=b^2$
- $n$ 整除 $m$（$n\mid m$）$\iff\exists k\in\Z,\ m=nk$
- 两个整数的和、差、积仍是整数（证明里写"因为 $2k^2+2k$ 是整数"就是在用这条）

### 1a）翻译 Hypotheses 1–3（9 分）

**解题前先做三件事（翻译题 SOP）：**

<div class="callout ok"><div class="ttl">Hypothesis 1：Every student who attends all lectures is respected.</div>

$$\forall x\,\big(\forall y\,A(x,y)\to R(x)\big)$$

- "Every student" → 最外层 $\forall x$
- "who attends all lectures" → 对这个 $x$，==所有== $y$ 都 $A(x,y)$：$\forall y\,A(x,y)$。这是一个关于 $x$ 的"条件"
- "is respected" → $R(x)$
- "Every … who [条件] is [结果]" 是 $\forall$ + $\to$（见公式表 1.5 B）
</div>

<div class="callout bad"><div class="ttl">常见错误（第一性原理地说明为什么错）</div>

- ✗ $\forall x\forall y\,(A(x,y)\to R(x))$：这等价于 $\forall x\,(\exists y\,A(x,y)\to R(x))$（公式表 1.5 E 的"翻转"条），意思变成"只要上过==任一节==课就被尊重"。$y$ 的 $\forall$ 必须留在前件==里面==。

- ✗ 用 $\land$ 代替 $\to$。
</div>

<div class="callout ok"><div class="ttl">Hypothesis 2：A student attends some lectures if and only if the student understands the material.</div>

$$\forall x\,\big(\exists y\,A(x,y)\leftrightarrow M(x)\big)$$

"A student" 泛指任何学生 → $\forall x$；"attends some lectures" → $\exists y\,A(x,y)$；"if and only if" → $\leftrightarrow$。

<div class="callout ok"><div class="ttl">Hypothesis 3：If a student understands the material, then the student passes the course.</div>

$$\forall x\,\big(M(x)\to P(x)\big)$$

</div>

**卷面 −5 的可能原因**：把 ii) 或 iii) 写成"可以推出"；或者写了"不能"但没有说明谬误类型 / 没有给反例场景。

> **这类题的第一性原理**：每个 → 只约束"前件为真"的那一半世界。有效推理只能沿着箭头==顺着走（MP）==或者从==箭头尾部的否定倒着走（MT）==。拿到 ¬前件 或 后件 就想推东西，一定是谬误。一句话自检：**"我现在手里的是前件还是后件？是肯定还是否定？"** 只有 "肯定前件" 和 "否定后件" 两种组合能动。

<script type="text/x-markdown" id="md-q2">
### 通用解法（SOP）

1. 两边分别化简，==顺序固定==：消 ↔ → 消 → → De Morgan 把 ¬ 推到变量上 → 分配律 / 吸收律整理。
2. 化到同一形式 ⇒ 等价，每一步标规则名。
3. 化不到一起 ⇒ 大概率不等价，去找反例：盯着"哪一行会让两边不同"。找反例的技巧：让某个 → 的前件真后件假；或让一边的某个 ∧ 项为 F 而另一边不受影响。

### 2a）$((p\land\neg q)\lor(p\land r))$ 与 $(p\land(q\to r))$ —— ==等价== ✓

$$\begin{aligned}
&(p\land\neg q)\lor(p\land r)\\
\equiv\ & p\land(\neg q\lor r) && \text{Distributive Laws（反向使用：提公因式 }p\text{）}\\
\equiv\ & p\land(q\to r) && p\to q\equiv\neg p\lor q\text{（反向使用）}
\end{aligned}$$

∴ 等价。**第一性原理**：分配律就是"提公因式"—— $p\land(\neg q\lor r)$ 像 $p\times(a+b)=pa+pb$。

### 2b）$(p\to(q\to r))$ 与 $((p\land q)\to r)$ —— ==等价== ✓（Exportation 律）

$$\begin{aligned}
&p\to(q\to r)\\
\equiv\ & \neg p\lor(q\to r) && p\to q\equiv\neg p\lor q\\
\equiv\ & \neg p\lor(\neg q\lor r) && p\to q\equiv\neg p\lor q\\
\equiv\ & (\neg p\lor\neg q)\lor r && \text{Associative Laws}\\
\equiv\ & \neg(p\land q)\lor r && \text{De Morgan's Laws}\\
\equiv\ & (p\land q)\to r && p\to q\equiv\neg p\lor q
\end{aligned}$$

∴ 等价。**直觉**："如果 p，那么（如果 q，那么 r）" = "如果 p 且 q，那么 r"。两个条件先后给和一起给是一回事。

### 2c）$p$ 与 $\forall x\,(\neg p\to(p\land r(x)))$，$p$ 与 $x$ 无关，域非空 —— ==等价== ✓

$$\begin{aligned}
&\forall x\,(\neg p\to(p\land r(x)))\\
\equiv\ & \forall x\,(\neg\neg p\lor(p\land r(x))) && p\to q\equiv\neg p\lor q\\
\equiv\ & \forall x\,(p\lor(p\land r(x))) && \text{Double Negation Law}\\
\equiv\ & \forall x\,(p) && \text{Absorption Laws: }p\lor(p\land q)\equiv p\\
\equiv\ & p && p\text{ 不含 }x\text{ 且域非空：}\forall x\,A\equiv A
\end{aligned}$$

∴ 等价。

<div class="callout warn"><div class="ttl">为什么题目要强调"域非空"</div>
若域为空，$\forall x(\dots)$ 是==空真==（vacuously true，因为找不到反例），这时即使 $p=\mathbf F$ 左边也为 T，两边就不等价了。题目给出"非空"就是为了让最后一步 $\forall x\,p\equiv p$ 成立——答题时==要把这个条件写出来==作为最后一步的理由。
</div>

**为什么吸收律成立（第一性原理）**：$p\lor(p\land r)$：$p$ 真则整体真；$p$ 假则 $p\land r$ 也假，整体假。所以整体真值 = $p$。

### 若遇到"不等价"该怎么写（tutorial 1 Q3 的格式）

> Counterexample: When $p=\mathbf T$, $q=\mathbf F$, (LHS) is T but (RHS) is F.

要==给出具体赋值==并==算出两边的值==，不能只说"不等价"。
</script>

<script type="text/x-markdown" id="md-q4">
$P(x,y):\ x+y=10$，$x,y\in\Z$。

### 通用解法（SOP）

1. 从左到右读，==∀ = 对手任选，∃ = 我选==，后面的量词可以"看见"前面的选择。
2. $\forall$ 为真要给出**对所有情况都成立的理由**；$\forall$ 为假给**一个反例**。
3. $\exists$ 为真给**一个例子**；$\exists$ 为假要说明**所有候选都不行**（通常用反证：假设存在，推矛盾）。
4. 注意域：整数 vs 实数 vs 正整数，答案可能不同。

### 4a）$\forall y\,\forall x\,P(x,y)$ —— ==假==

意思：任何 $y$、任何 $x$，都有 $x+y=10$。反例：$x=0,\ y=0$，$0+0=0\neq 10$。

### 4b）$\exists y\,\forall x\,P(x,y)$ —— ==假==

意思：存在一个"万能的" $y$，使得对**所有** $x$ 都有 $x+y=10$。

理由（反证）：假设这样的 $y$ 存在。取 $x=0$ 得 $y=10$；取 $x=1$ 得 $y=9$。$y$ 不能同时等于 10 和 9，矛盾。∴ 不存在。（博弈读法：我先选 $y$，对手再选 $x$，对手总能选 $x\neq 10-y$ 让我输。）

**卷面 −2 的可能原因**：这一问只写 "False" 没写理由，或者理由只是"显然"。

### 4c）$\forall y\,\exists x\,P(x,y)$ —— ==真==

意思：对任意 $y$，都能找到 $x$ 使 $x+y=10$。理由：对任意整数 $y$，取 ==x = 10 − y==，它是整数（整数减整数仍是整数），且 $(10-y)+y=10$。（博弈读法：对手先选 $y$，我看着 $y$ 选 $x=10-y$，必胜。）

### 4d）$\exists y\,\exists x\,P(x,y)$ —— ==真==

举例：$x=5,\ y=5$，$5+5=10$。

### 第一性原理：b) 和 c) 的区别就是整章最重要的"量词顺序"

| 式子 | 谁先选 | $x$ 能不能依赖 $y$ | 结果 |
|---|---|---|---|
| $\exists y\,\forall x$ | 我先定 $y$ | 不能 | 要一个 $y$ 通吃所有 $x$，不可能 |
| $\forall y\,\exists x$ | 对手先定 $y$ | 能 | 每个 $y$ 都配一个 $x=10-y$，可以 |

记牢：==∃∀ ⇒ ∀∃ 成立，反过来不成立==。
</script>

<script type="text/x-markdown" id="md-q5">
### 怎么选方法

- 要证的是 $\forall n\,(\text{Even}(n^2)\to\text{Even}(n))$，形式是 $p\to q$。
- **直接法试一下**：设 $n^2=2k$，要推 $n$ 是偶数，只能 $n=\pm\sqrt{2k}$，开根号后看不出奇偶 —— ==走不通==（slides 1.6 p54 原话 "may not be useful"）。
- **换逆否**：$\neg q\to\neg p$，即 ==n 是奇数 ⇒ n² 是奇数==。从 "$n$ 奇" 出发可以写 $n=2k+1$，直接平方展开，能算 —— 走得通。
- 这就是选逆否法的唯一标准：==哪一头能代公式、能做代数，就从哪一头出发==。

```mermaid
flowchart TD
  G["目标: n² 偶 → n 偶"] --> D{"直接法:<br/>从 n² = 2k 出发?"}
  D -->|"n = ±√(2k)<br/>看不出奇偶"| X["走不通 ✗"]
  G --> C{"逆否: n 奇 → n² 奇<br/>(p→q ≡ ¬q→¬p)"}
  C -->|"n = 2k+1 可以平方展开"| Y["走得通 ✓"]
  Y --> P["n² = 2(2k²+2k)+1 是奇数"]
```

<div class="proof">
<p><b>Proof (by contraposition).</b></p>
<p>We prove the contrapositive: if $n$ is odd, then $n^2$ is odd.</p>
<p>Assume $n$ is odd. By definition, $n=2k+1$ for some integer $k$.</p>
<p>Then</p>
$$n^2=(2k+1)^2=4k^2+4k+1=2(2k^2+2k)+1.$$
<p>Since $2k^2+2k$ is an integer, $n^2=2m+1$ with $m=2k^2+2k\in\Z$, so $n^2$ is odd by definition.</p>
<p>Hence "$n$ odd ⇒ $n^2$ odd" holds, and since $p\to q\equiv\neg q\to\neg p$, the original statement "if $n^2$ is even then $n$ is even" is true. <span class="qed">∎</span></p>
</div>

### 用反证法写也可以（tutorial 3 Q8b 的格式）

Assume, for contradiction, that $n^2$ is even **and** $n$ is odd（即 $\neg(p\to q)\equiv p\land\neg q$）. Then $n=2k+1$, $n^2=2(2k^2+2k)+1$ is odd, contradicting "$n^2$ is even". ∴ the statement holds. ∎

### 写证明题必须出现的四样东西（阅卷点）

1. 写明==方法名==（by contraposition / by contradiction / direct）。
2. 写明==假设什么==（Assume …）。
3. 用==定义==展开（$n=2k+1$，where $k$ is an integer）。
4. 结论处==回到定义==（"$2k^2+2k$ is an integer, so $n^2$ is odd"）—— 不写"是整数"这一句会被扣。

### 相关同类公式（奇偶性全家桶，期末可能换着考）

- 奇 + 奇 = 偶，偶 + 偶 = 偶，奇 + 偶 = 奇
- 奇 × 奇 = 奇，有一个偶因子积就是偶
- $n$ 与 $n^2$ 奇偶性相同；$n$ 与 $n^3$ 奇偶性相同；$n$ 偶 $\iff 3n+1$ 奇（tutorial 3 Q9）
- 全部用 $n=2k$ 或 $2k+1$ 代入展开证明。
</script>

<script type="text/x-markdown" id="md-q6">
**题目**：固定整数 $n\ge 2$。证明对每个整数 $a$，存在==唯一==的整数 $q$、$r$，满足 $0\le r<n$ 且 $a=nq+r$。（这就是"除法算法 Division Algorithm"：$q$ 是商，$r$ 是余数。）

### 怎么选方法

"there exist unique" ⇒ ==唯一性证明==，固定两步（slides 1.6 p80）：

1. **Existence**：造出一组 $q$、$r$ 并验证满足条件。
2. **Uniqueness**：假设有两组 $(q_1,r_1)$ 和 $(q_2,r_2)$ 都满足，推出 $q_1=q_2$ 且 $r_1=r_2$。

卷面手写"唯一的?"说明当时没意识到要分两部分写。==只写存在不写唯一，最多一半分==。

<div class="proof">
<p><b>Proof.</b></p>
<p><b>(Existence)</b> Let $q=\lfloor a/n\rfloor$（不超过 $a/n$ 的最大整数）and $r=a-nq$.</p>
<p>By definition of floor, $q\le a/n<q+1$. Multiplying by $n>0$: $nq\le a<nq+n$, so $0\le a-nq<n$, i.e. $0\le r<n$.</p>
<p>Both $q$ and $r$ are integers, and $a=nq+r$. So such $q,r$ exist.</p>
<p><b>(Uniqueness)</b> Suppose $a=nq_1+r_1=nq_2+r_2$ with $0\le r_1<n$ and $0\le r_2<n$.</p>
<p>Subtracting: $n(q_1-q_2)=r_2-r_1$. So $n$ divides $r_2-r_1$.</p>
<p>But from $0\le r_1,r_2<n$ we get $-n<r_2-r_1<n$.</p>
<p>The only multiple of $n$ strictly between $-n$ and $n$ is $0$, so $r_2-r_1=0$, i.e. $r_1=r_2$.</p>
<p>Then $n(q_1-q_2)=0$ and $n\neq 0$ give $q_1=q_2$. Hence $q$ and $r$ are unique. <span class="qed">∎</span></p>
</div>

<div class="callout"><div class="ttl">不想用 floor 的存在性写法（良序原理）</div>
令 $S=\{\,a-nk : k\in\Z,\ a-nk\ge 0\,\}$。$S$ 非空（取 $k=-|a|$ 即可，因为 $a+n|a|\ge a+|a|\ge 0$）。由良序原理 $S$ 有最小元 $r=a-nq\ge 0$。若 $r\ge n$，则 $r-n=a-n(q+1)\in S$ 且更小，矛盾，故 $r<n$。
</div>

### 第一性原理

- ==存在性==本质是"把答案构造出来"：余数就是 $a$ 减掉 $n$ 的最大整数倍。
- ==唯一性==的通用模板：**"设有两个，证明它们相等"**。这是 $\exists!x\,P(x)\equiv\exists x\,(P(x)\land\forall y\,(P(y)\to y=x))$ 的后半段。
- 这里"相等"的关键武器是**"被 $n$ 整除且绝对值小于 $n$ 的整数只能是 0"**——余数范围 $0\le r<n$ 的作用就在这一步，==题目给的每个条件都要被用到==。

### 同类题模板（tutorial 3 Q10、slides p81）

> Show that if $a\neq 0$, there is a unique real $r$ with $ar+b=0$.
> Existence: $r=-b/a$ works. Uniqueness: if $as+b=0$ too, then $ar=as$, $a\neq 0\Rightarrow r=s$.
</script>

## 模板 A：英文 → 逻辑式（1a 型，tutorial 2 Q6 / Q7）

1. 列出谓词和各变量的域。
2. 圈出量词词：every / all / any / each / no one → $\forall$；some / a / there is / at least one → $\exists$；exactly one → $\exists$ + $\forall$ 组合。
3. 圈出联结词：if-then / only if / iff / and / or / not / unless（= if not）。
4. ==∀ 配 →，∃ 配 ∧==。
5. 每个变量都要有量词；注意量词作用域，"attends all lectures" 这种限定要放在前件里面。
6. 检查：把式子直译回英文读一遍，和原句意思是否一致？

## 模板 B：逻辑式 → 英文（tutorial 2 Q3 / Q4 / Q5）

从左到右读量词（$\forall$ "每个"，$\exists$ "有一个"），然后把谓词套回去，最后润色成自然句子。嵌套不同类型量词时，注意谁依赖谁。

## 模板 C：判断等价（第 2 题，tutorial 1 Q3）

消 ↔ → 消 → → De Morgan → 分配 / 吸收 → 两边对齐；不行就给具体赋值反例并算出两边值。每步写规则名。

## 模板 D：形式推理 / 论证是否有效（1b，tutorial 3 Q1 / Q2）

1. 翻译所有前提和结论。
2. 对带 $\forall$ 的前提先 ==UI== 到具体对象；带 $\exists$ 的先 ==EI==（给新名字 $c$）。
3. 用 MP / MT / 三段论等一步步推；需要时 ==EG== 回到 $\exists$。
4. 写成 Step | Reason 表。
5. 推不出来时：检查是不是"肯定后件"或"否定前件"；写出谬误名，并给一个前提全真结论假的场景。

```mermaid
flowchart TD
  A["翻译前提与结论"] --> B["∀ 前提 → UI 到具体对象<br/>∃ 前提 → EI 给新名字 c"]
  B --> C["MP / MT / 三段论 逐步推"]
  C --> D{"推到结论了?"}
  D -- 是 --> E["写 Step | Reason 表<br/>需要时 EG 回到 ∃"]

  F -- 是 --> G["谬误: 否定前件 / 肯定后件<br/>写谬误名 + 反例场景"]
  F -- 否 --> C
```

## 模板 E：量词语句真假（第 4 题，tutorial 2 Q1 / Q2）

从左读到右；$\forall$ 真给通用论证 / 假给反例；$\exists$ 真给例子 / 假用反证说明全都不行；盯紧域。

## 模板 F：量词式否定（tutorial 2 Q8）

$\neg$ 逐层往里推，每穿过一个量词翻转一次（$\forall\leftrightarrow\exists$），到谓词前停下。遇到 $\to$ 先改成 $\neg p\lor q$ 再 De Morgan：$\neg(p\to q)\equiv p\land\neg q$；$\neg(p\leftrightarrow q)\equiv p\leftrightarrow\neg q$。

## 模板 G：证明题（第 5、6 题，tutorial 3 Q4–Q13）

| 看到 | 用 |
|---|---|
| if p then q，从 p 能算 | 直接证明 |
| if p then q，从 p 算不动（开根号、"n² 是偶数"） | ==逆否== |
| "是无理数"、"没有整数解"、"不可能" | ==反证== |

| 绝对值、奇偶、正负、min/max | 分情况 |
| n ≤ 某个小数 | 穷举 |
| there exists | 举例 |
| unique / exactly one | ==存在 + 唯一==（设两个推相等） |

证明四件套：==方法名、Assume、定义展开、回到定义收尾==。

      primaryBorderColor: dark ? '#8fa0ff' : '#2d3d8f', lineColor: dark ? '#b3bfff' : '#2d3d8f',
      secondaryColor: dark ? '#3a2a4a' : '#fbe9e9', tertiaryColor: dark ? '#262939' : '#fbf8f1',
      clusterBkg: dark ? '#1f2130' : '#fbf8f1', edgeLabelBackground: dark ? '#1f2130' : '#ffffff',
      fontSize:'15px'
    }
  });
  mermaidReady = true;
}

const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let markedReady=false;
function setupMarked(){
  if (markedReady) return; markedReady=true;
  marked.use({ gfm:true, breaks:false, renderer:{
    code(code, lang){
      if ((lang||'').trim() === 'mermaid') return `<div class="mmd"><pre hidden>${esc(code)}</pre></div>`;
      return `<pre><code>${esc(code)}</code></pre>`;
    },
    table(header, body){ return `<div class="tbl"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`; }
  }});
}

function renderMarkdown(src){
  // 1. protect math
  const math = [];
  let s = src.replace(/\$\$([\s\S]+?)\$\$/g, (m) => { math.push(m); return `@@MATH${math.length-1}@@`; });
  s = s.replace(/\$([^\$\n]+?)\$/g, (m) => { math.push(m); return `@@MATH${math.length-1}@@`; });
  // 2. markdown
  setupMarked();
  let html = marked.parse(s);
  // 3. keywords ==x==
  html = html.replace(/==([^=\n]+?)==/g, '<strong class="kw">$1</strong>');
  // 4. restore math (escaped so MathJax reads clean TeX via textContent)
  html = html.replace(/@@MATH(\d+)@@/g, (m, i) => {
    const tex = math[+i];
    const disp = tex.startsWith('$$');
    return disp ? `<span class="mjx-disp">${esc(tex)}</span>` : `<span class="mjx">${esc(tex)}</span>`;
  });
  return html;
}

let mmdCounter = 0;
async function hydrate(el){
  if (!el) return;
  initMermaid();
  const blocks = el.querySelectorAll('.mmd');
  for (const b of blocks){
    const pre = b.querySelector('pre'); if (!pre) continue;
    const code = pre.textContent;
    try {
      const { svg } = await mermaid.render('mmd-' + (++mmdCounter), code);
      b.innerHTML = svg;
    } catch(e){ b.innerHTML = `<pre>${esc(code)}</pre>`; }
  }
  if (window.MathJax && MathJax.typesetPromise){
    try { await MathJax.typesetPromise([el]); } catch(e){ console.warn(e); }
  }
}

function Md({ id, children }){
  const ref = useRef(null);
  const html = useMemo(() => {
    const node = document.getElementById(id);
    return node ? renderMarkdown(node.textContent) : '';
  }, [id]);
  useEffect(() => { hydrate(ref.current); }, [html]);
  return <div className="md" ref={ref} dangerouslySetInnerHTML={{__html: html}} />;
}

function App(){
